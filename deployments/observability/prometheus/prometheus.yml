global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NestJS API. /metrics is served by src/modules/metrics (prom-client
  # default Node.js/process metrics) and is public — see
  # src/modules/authenticated/decorators/public.decorator.ts.
  - job_name: app
    static_configs:
      - targets: ["app:3000"]
    metrics_path: /metrics
