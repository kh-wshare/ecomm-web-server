# Infra-only compose for local development (Postgres/Redis/RabbitMQ only,
# no app container) — for the production/full-stack compose, see
# docker-compose.prod.yml in this same directory.
# Run (from the repo root): docker compose -f deployments/docker-compose/docker-compose.dev.yml up -d
# Then start the app locally: pnpm run start:dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomm_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: soklay512
      POSTGRES_DB: dev_db
    ports:
      - "5448:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecomm_redis_dev
    restart: unless-stopped
    ports:
      - "6388:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecomm_rabbitmq_dev
    restart: unless-stopped
    ports:
      - "5682:5672"
      - "15682:15672"
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
