# Local gateway for the micro-frontends.
#
# Start the apps first:
#   pnpm merchant:dev
#   pnpm pos:dev
#   pnpm storefront:dev
#
# Then run:
#   docker compose -f docker-compose.gateway.yml up
#
# The gateway listens on http://localhost and proxies to the host ports used by
# the Next.js dev servers.
services:
  gateway:
    image: nginx:1.27-alpine
    container_name: commerce_gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
